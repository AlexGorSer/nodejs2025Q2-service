name: home-library
services:
  data-base:
    container_name: home-library-data-base
    build:
      dockerfile: Dockerfile.data-base
    ports:
      - '${PORT_DATA_BASE}:${PORT_DATA_BASE}'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      [
        'postgres',
        '-c',
        'logging_collector=on',
        '-c',
        'log_directory=/var/lib/postgresql/logs',
        '-c',
        'log_statement=all',
      ]
    volumes:
      - postgres-data-base:/var/lib/postgresql/data
      - postgres-logs:/var/lib/postgresql/logs

    restart: always
    networks:
      - home-library

  app:
    container_name: home-library-server
    build:
      dockerfile: Dockerfile.prod
    ports:
      - '${PORT}:${PORT}'
    env_file: .env
    restart: always
    networks:
      - home-library
    depends_on:
      - data-base

volumes:
  postgres-data-base:
  postgres-logs:

networks:
  home-library:
    driver: bridge
