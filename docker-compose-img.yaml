name: home-library
services:
  data-base:
    container_name: home-library-data-base
    image: postgres:17.5-alpine3.22
    ports:
      - '${PORT_DATA_BASE}:${PORT_DATA_BASE}'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      [
        'postgres',
        '-c',
        'logging_collector=on',
        '-c',
        'log_directory=/var/lib/postgresql/logs',
        '-c',
        'log_statement=all',
      ]
    volumes:
      - postgres-data-base-img:/var/lib/postgresql/data
      - postgres-logs:/var/lib/postgresql/logs
    restart: on-failure
    networks:
      - home-library
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-db}',
        ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 15s

  app:
    container_name: home-library-server
    image: alexgorser/home-library-app:latest
    ports:
      - '${PORT}:${PORT}'
    env_file: .env
    restart: on-failure
    networks:
      - home-library
    command: 'npm run start:prod'
    depends_on:
      data-base:
        condition: service_healthy

volumes:
  postgres-data-base-img:
  postgres-logs:

networks:
  home-library:
    driver: bridge
