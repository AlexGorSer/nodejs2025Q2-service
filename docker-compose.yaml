name: home-library
services:
  data-base:
    container_name: home-library-data-base
    build:
      dockerfile: Dockerfile.data-base
    ports:
      - '${PORT_DATA_BASE}:${PORT_DATA_BASE}'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      [
        'postgres',
        '-c',
        'logging_collector=on',
        '-c',
        'log_directory=/var/lib/postgresql/logs',
        '-c',
        'log_statement=all',
      ]
    volumes:
      - postgres-data-base:/var/lib/postgresql/data
      - postgres-logs:/var/lib/postgresql/logs

    restart: on-failure
    networks:
      - home-library
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-db}',
        ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  app:
    container_name: home-library-server
    build:
      dockerfile: Dockerfile.server
    ports:
      - '${PORT}:${PORT}'
    env_file: .env

    depends_on:
      data-base:
        condition: service_healthy
    networks:
      - home-library
    restart: on-failure
    command: 'npm run start:dev'
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src

volumes:
  postgres-data-base:
  postgres-logs:

networks:
  home-library:
    driver: bridge
